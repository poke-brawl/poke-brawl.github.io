<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#151933">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Poke-Brawl</title>
<meta name="apple-mobile-web-app-title" content="Poke-Brawl">
<meta name="application-name" content="Poke-Brawl">
<link rel="stylesheet" href="css/style.css?v=0.99.43">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="preload" as="image" href="assets/logo/title-ko.png">
<link rel="preload" as="image" href="assets/logo/title-en.png">
<link rel="preload" as="image" href="assets/logo/title-ja.png">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
<div id="screen-wrap">
  <canvas id="screen" width="320" height="180"></canvas>
  <div id="ui"></div>
  <div id="loading">…</div>
  <button id="menu-btn" aria-label="menu"></button>
</div>
<div id="rotate"><div class="phone"></div><div id="rotate-t"></div><small id="rotate-s"></small></div>
<div id="pad">
  <div id="stick" aria-label="stick"><div class="knob"></div></div>
  <div class="six">
    <button data-k="A" class="b-a">공격</button>
    <button data-k="J" class="b-j">점프</button>
    <button data-k="G" class="b-g">잡기</button>
    <button data-k="C" class="b-c">스매시</button>
    <button data-k="B" class="b-b">기술</button>
    <button data-k="S" class="b-s">실드</button>
  </div>
</div>
<script>
// 다른 사이트가 이 게임을 iframe으로 띄우면 게임 대신 공식 주소 안내만 보여 준다 (같은 사이트 안의 iframe은 그대로)
(function () {
  var other = false;
  if (window.top !== window.self) { try { other = window.top.location.origin !== location.origin; } catch (e) { other = true; } }
  if (!other) return;
  var u = 'https://poke-brawl.github.io/';
  var l = (navigator.language || 'ko').slice(0, 2);
  var t = l === 'ja' ? ['このページでは遊べません。', '公式サイトで遊んでください'] : l === 'ko' ? ['이 페이지에서는 플레이할 수 없습니다.', '공식 주소에서 플레이해 주십시오'] : ['This game can\u2019t be played on this page.', 'Please play at the official site'];
  document.write('<style>body>*:not(#nf){display:none!important}</style><div id="nf" style="position:fixed;z-index:99999;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#151933;color:#fff;font:16px sans-serif;text-align:center;padding:16px">' +
    '<b style="font-size:22px">Poke-Brawl</b><div>' + t[0] + '<br>' + t[1] + '</div>' +
    '<a href="' + u + '" target="_blank" rel="noopener" style="color:#ffd84a;font-size:20px">' + u + '</a></div><plaintext style="display:none">');
})();
</script>
<script src="assets/lib/peerjs.min.js"></script>
<script type="module" src="js/main.js?v=0.99.43"></script>
</body>
</html>
